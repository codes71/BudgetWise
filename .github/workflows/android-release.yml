name: Pocket Peek Android release
run-name: Internal ${{ inputs.version_name }} (${{ inputs.version_code }}), approved by ${{ inputs.approved_by }}

# Dispatch is approval from owner or agent. No push/tag or human-only reviewer gate.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character approved commit SHA (must match selected ref)
        required: true
        type: string
      version_code:
        description: Explicit unused versionCode, above every previous Play upload
        required: true
        type: string
      version_name:
        description: Explicit versionName (for example 0.3.1)
        required: true
        type: string
      release_notes:
        description: English release notes, 1 to 500 characters
        required: true
        type: string
      approved_by:
        description: Who approved this exact release after reviewing its checks
        required: true
        type: choice
        options: [owner, agent]
      approve_internal:
        description: Approve automatic app.pocketpeek internal publication after all checks pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Serializes publication; GitHub retains one pending run, not an unlimited queue.
concurrency:
  group: android-release
  cancel-in-progress: false

env:
  INPUT_SOURCE_SHA: ${{ inputs.source_sha }}
  INPUT_VERSION_CODE: ${{ inputs.version_code }}
  INPUT_VERSION_NAME: ${{ inputs.version_name }}
  INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
  INPUT_APPROVED_BY: ${{ inputs.approved_by }}
  INPUT_APPROVE_INTERNAL: ${{ inputs.approve_internal }}

jobs:
  verify:
    name: Verify approved source without signing credentials
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate approval and exact checkout
        run: python3 tools/android-release/play_release.py inputs
      - name: Release guard and workflow regression tests
        run: |
          python3 -m pip install -r tools/android-release/requirements-test.txt
          python3 -m unittest discover -s tools/android-release -p 'test_*.py' -v
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Android tests, build and lint for this exact commit
        working-directory: apps/android
        run: >-
          ./gradlew --continue
          :core:data:testDebugUnitTest :app:testDebugUnitTest :nlu:test
          :feature:voice:testDebugUnitTest :asr:testDebugUnitTest :asr-demo:testDebugUnitTest
          :app:assembleDebug :app:lintDebug :app:lintFriends :app:lintRelease
          :core:data:lintDebug :asr:lintDebug :feature:voice:lintDebug
      - name: Retain approval and failed-check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pocket-peek-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release/approval.json
            apps/android/**/build/reports/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Build verified source and publish internal only
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RELEASE_API_BASE_URL: ${{ vars.BUDGETWISE_RELEASE_API_BASE_URL }}
      EXPECTED_UPLOAD_CERT_SHA256: ${{ vars.BUDGETWISE_PLAY_UPLOAD_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Recheck approval and exact checkout
        run: python3 tools/android-release/play_release.py inputs
      - name: Fail on missing signing, API or Play configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 tools/android-release/play_release.py config
      - name: Install official Google authentication client
        run: python3 -m pip install -r tools/android-release/requirements-play.txt
      - name: Refuse reused or superseded version codes before building
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: >-
          python3 tools/android-release/play_api.py --mode preflight
          --version-code "$INPUT_VERSION_CODE" --receipt release/play-preflight.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - name: Decode the upload keystore into the runner temporary directory
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          target = Path(os.environ["RUNNER_TEMP"]) / "upload-keystore.jks"
          data = base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True)
          if not data:
              raise SystemExit("Empty upload keystore")
          descriptor = os.open(target, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(descriptor, "wb") as output:
              output.write(data)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("ANDROID_KEYSTORE_FILE=" + str(target) + "\n")
          PY
      - name: Build signed release AAB once
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:bundleRelease
          -Pbudgetwise.versionCode="$INPUT_VERSION_CODE"
          -Pbudgetwise.versionName="$INPUT_VERSION_NAME"
          -Pbudgetwise.releaseApiBaseUrl="$RELEASE_API_BASE_URL"
      - name: Download checksum-pinned official bundletool
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
      - name: Verify signed bundle identity, compiled API and packaging
        id: bundle
        run: >-
          python3 tools/android-release/play_release.py bundle
          --aab apps/android/app/build/outputs/bundle/release/app-release.aab
          --mapping apps/android/app/build/outputs/mapping/release/mapping.txt
          --bundletool "$RUNNER_TEMP/bundletool.jar" --receipt release/verification.json
      - name: Archive the exact verified candidate before publishing
        uses: actions/upload-artifact@v7
        with:
          name: pocket-peek-app-release-${{ inputs.version_code }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/mapping/release/mapping.txt
            release/
          if-no-files-found: error
          retention-days: 90
      - name: Recheck version inventory immediately before publication
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: >-
          python3 tools/android-release/play_api.py --mode preflight
          --version-code "$INPUT_VERSION_CODE" --receipt release/play-final-preflight.json
      - name: Publish the approved bundle to internal testing
        id: upload
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.pocketpeek
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: Pocket Peek ${{ inputs.version_name }} (${{ inputs.version_code }})
          whatsNewDirectory: release/whatsnew
          mappingFile: apps/android/app/build/outputs/mapping/release/mapping.txt
      - name: Verify committed internal version and bundle hash independently
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          AAB_SHA256: ${{ steps.bundle.outputs.aab_sha256 }}
        run: >-
          python3 tools/android-release/play_api.py --mode readback
          --version-code "$INPUT_VERSION_CODE" --aab-sha256 "$AAB_SHA256"
          --receipt release/play-readback.json
      - name: Retain publication outcome even if upload or readback fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pocket-peek-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: warn
          retention-days: 90
      - name: Remove the temporary upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
