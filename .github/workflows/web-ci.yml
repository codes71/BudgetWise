name: Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [master]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      # Only the historical Mongo->Firestore copy project needs Java and the Firestore emulator.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # Runtime/API tests own a temporary Mongo replica set. Legacy-copy tests own a separate emulator namespace.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/firebase/emulators
          key: web-test-binaries-${{ runner.os }}-${{ hashFiles('apps/web/package-lock.json') }}
          restore-keys: web-test-binaries-${{ runner.os }}-

      - run: npm ci

      # `next lint` has no ESLint config yet; this step turns on once one is added.
      - name: Lint
        if: hashFiles('apps/web/eslint.config.*', 'apps/web/.eslintrc*') != ''
        run: npm run lint

      - name: Unit and API tests (Mongo replica set plus isolated legacy copy)
        run: npm test

      - name: Build
        run: npm run build
